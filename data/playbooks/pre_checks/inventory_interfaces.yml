---
- name: IMPORT PLAYBOOK
  ansible.builtin.import_playbook: inventory_target_variable.yml

- name: PRINT INTERFACES
  hosts: fabric
  gather_facts: false
  tasks:

    - name: Summary
      ansible.builtin.debug:
        msg:
          - "{{ hardware.manufacturer }} {{ hardware.model }}"
          - "{{ all_interfaces | selectattr('type', 'equalto', '100gbase-x-qsfp28') | length }} x 100G"
          - "{{ all_interfaces | selectattr('type', 'equalto', '25gbase-x-sfp28') | length }} x 25G"
          - "{{ all_interfaces | selectattr('type', 'equalto', '10gbase-x-sfpplus') | length }} x 10G"
          - "{{ all_interfaces | selectattr('type', 'equalto', '1000base-t') | length }} x 1G"
          - "Enabled interfaces: {{ all_interfaces | selectattr('enabled') | map(attribute='name') }}"
      tags: summary

    - name: Management interfaces
      ansible.builtin.debug:
        msg: "{{ mgmt_interfaces }}"
      tags: mgmt

    - name: Enabled ethernet interfaces
      ansible.builtin.debug:
        msg: "{{ interfaces | selectattr('enabled') | selectattr('type', 'in', defaults.ethernet_types) }}"
      tags: ethernets

    - name: Enabled loopback interfaces
      ansible.builtin.debug:
        msg: "{{ interfaces | selectattr('enabled') | selectattr('type', 'equalto', 'loopback') }}"
      tags: loopbacks

    - name: Enabled LAG interfaces
      ansible.builtin.debug:
        msg: "{{ interfaces | selectattr('enabled') | selectattr('type', 'equalto', 'lag') }}"
      tags: lags

    - name: Enabled VLAN interfaces
      ansible.builtin.debug:
        msg: "{{ interfaces | selectattr('enabled') | selectattr('type', 'equalto', 'svi') }}"
      tags: svis

- name: CHECK INTERFACES
  hosts: fabric
  gather_facts: false
  tags: checks
  tasks:

    - name: Detect wrong interface names
      ansible.builtin.assert:
        that: item.name | regex_search(item.name_regex)
        quiet: true
        fail_msg: "Name {{ item.name }} does not match {{ item.name_regex }}"
      loop: "{{ interfaces }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Detect duplicated interface names
      ansible.builtin.assert:
        that: unique_names_count == names_count
        quiet: true
        fail_msg: "Duplicate found in {{ item }}"
      vars:
        unique_names_count: "{{ vars[item] | map(attribute='name') | unique | length }}"
        names_count: "{{ vars[item] | map(attribute='name') | length }}"
      when: vars[item] is defined
      loop:
        - ethernets
        - loopbacks
        - lags
        - svis
