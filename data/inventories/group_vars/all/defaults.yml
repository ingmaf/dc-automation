---
all_host_defaults:
  hostname: device
  ethernet_types:
    - 100gbase-x-qsfp28
    - 25gbase-x-sfp28
    - 10gbase-x-sfpplus
    - 1000base-t
  logical_interface:
    lag:
      type: lag
    loopback:
      type: loopback
    svi:
      type: svi

defaults:
  hostname: "{{ nos_defaults.hostname | default(all_host_defaults.hostname) }}"
  ethernet_types: "{{ all_host_defaults.ethernet_types }}"
  logical_interface: "{{ all_host_defaults.logical_interface | combine(nos_defaults.logical_interface, recursive=True) }}"
